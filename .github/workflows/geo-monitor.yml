name: GEO Monitor (AI citation share)

# Ogni lunedì 07:00 UTC: pone le 20 domande "da cliente" di
# _system/research/geo/queries.yml a Claude (web search) e Gemini (Google
# Search grounding), misura se My Villa viene citata e con quali errori,
# e committa _system/research/geo/** con [skip ci].
# Costo: Claude gira via ABBONAMENTO (Claude Code CLI headless, policy
# 2026-09-16: nessuna API a consumo) — pesa sul budget del piano Max
# (finestre di 5 ore), non sulla carta. Gemini ~$0.04/query.
# Trigger manuale: tab Actions → "GEO Monitor" → Run workflow.

on:
  schedule:
    - cron: "0 7 * * 1"   # lunedì 07:00 UTC
  workflow_dispatch:
    inputs:
      engine:
        description: "claude | gemini | both"
        required: false
        default: "both"
      limit:
        description: "solo le prime N query (0 = tutte)"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: geo-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    # Token dell'abbonamento (`claude setup-token`) per la CLI headless.
    # Se manca: LLMUnavailable → geo_monitor salta il motore Claude e
    # prosegue con Gemini.
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: _system/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r _system/requirements.txt

      # Claude Code CLI: backend del motore "claude" (abbonamento, web
      # search della CLI). Prima dello step Python. Status non bloccante.
      - name: Install Claude Code CLI
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Claude Code CLI (npm)
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version
      - name: Claude Code CLI status
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::warning::CLAUDE_CODE_OAUTH_TOKEN assente — motore Claude saltato, resta Gemini."
          fi
          python3 _system/scripts/llm_client.py --status || true

      - name: Run GEO monitor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          # Claude via abbonamento (nessun costo a consumo, ma ogni query con
          # web search pesa sul budget 5h del piano); Gemini ≈ $0.04/query.
          # Settimanale = solo Gemini; il PRIMO lunedì del mese = entrambi i
          # motori per il confronto completo. Override manuale via inputs.
          ENGINE="${{ github.event.inputs.engine }}"
          if [ -z "$ENGINE" ]; then
            if [ "$(date -u +%d)" -le 7 ]; then ENGINE="both"; else ENGINE="gemini"; fi
          fi
          LIMIT="${{ github.event.inputs.limit }}";   LIMIT="${LIMIT:-0}"
          echo "engine=$ENGINE limit=$LIMIT"
          python3 _system/scripts/geo_monitor.py --engine "$ENGINE" --limit "$LIMIT"

      - name: Commit results
        run: |
          git config user.name  "My Villa Bot"
          git config user.email "info@myvilla.la"
          git add _system/research/geo/
          if git diff --staged --quiet; then
            echo "Nessun risultato da committare."
            exit 0
          fi
          TODAY=$(date -u +%Y-%m-%d)
          git commit -m "GEO monitor ${TODAY} [skip ci]" \
                     -m "Auto-generated by GitHub Actions (geo-monitor.yml)" \
                     -m "Co-Authored-By: My Villa Bot <info@myvilla.la>"
          # Push resiliente a un origin avanzato (rail Mac / daily-publish):
          # mai force-push; pull --rebase e ritenta.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            echo "push rifiutato (tentativo $attempt), riallineo..."
            git pull --rebase --autostash origin main || true
          done
          echo "::warning::push non riuscito dopo 3 tentativi"
          exit 0
